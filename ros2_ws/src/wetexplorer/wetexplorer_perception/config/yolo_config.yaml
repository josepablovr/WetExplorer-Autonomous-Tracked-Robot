yolo_node:
  ros__parameters:
    model: "/ros2_ws/src/wetexplorer/wetexplorer_vision/models/object_recognition_V4_01/11n.pt"  # Path to the YOLO model
    use_3d: true  # Enable 3D processing
    input_image_topic: "/camera1/image_raw"  # Topic for input RGB image
    input_depth_topic: "/camera1/depth_raw"  # Topic for input depth image
    input_depth_info_topic: "/camera1/camera_info"  # T opic for input depth camera info
    target_frame: "camera_link"  # Target frame for transformations
    threshold: "0.9"

