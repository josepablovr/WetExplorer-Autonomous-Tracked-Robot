yolo_node:
  ros__parameters:
    model: "yolo11m-seg.pt"  # Path to the YOLO model
    use_3d: true  # Enable 3D processing
    # input_image_topic: "/camera/camera/color/image_raw"  # Topic for input RGB image
    # input_depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"  # Topic for input depth image
    # input_depth_info_topic: "/camera/camera/color/camera_info"  # Topic for input depth camera info
    input_image_topic: "/camera/color/image_raw"  # Topic for input RGB image
    input_depth_topic: "/camera/depth/image_raw/image_raw"  # Topic for input depth image
    nput_depth_info_topic: "/camera/depth/camera_info"  # Topic for input depth camera info
    target_frame: "camera_link"  # Target frame for transformations
