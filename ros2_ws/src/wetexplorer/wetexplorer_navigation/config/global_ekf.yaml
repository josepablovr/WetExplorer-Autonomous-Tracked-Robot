
ekf_global_node:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    two_d_mode: true
    sensor_timeout: 1.0
    publish_tf: true
    print_diagnostics: false
    frequency: 20.0
    odom0: /odometry/local
    odom0_config: [false, false, false,
                  false, false, false,
                  true, true, true,
                  false, false, true,
                  false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
    odom0_twist_rejection_threshold: 10.0



    odom1: /odometry/gps_cov
    # Each sensor reading updates some or all of the filter's state. These options give you greater control over which
    # values from each measurement are fed to the filter. For example, if you have an odometry message as input, but only
    # want to use its Z position value, then set the entire vector to false, except for the third entry. The order of the
    # values is x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az. Note that not some message types
    # do not provide some of the state variables estimated by the filter. For example, a TwistWithCovarianceStamped message
    # has no pose information, so the first six values would be meaningless in that case. Each vector defaults to all false
    # if unspecified, effectively making this parameter required for each sensor.
    odom1_config: [true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    # Use this parameter to provide specify how long the 
    odom1_differential: false
    odom1_queue_size: 1
    odom1_pose_rejection_threshold: 5.0
    odom1_relative: false

    imu0: /imu/heading_cov
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 1
    imu0_remove_gravitational_acceleration: true
    imu0_linear_acceleration_rejection_threshold: 10.0 #
    imu0_pose_rejection_threshold: 5.0           # Note the difference in parameter names
    imu0_twist_rejection_threshold: 5.0
    
